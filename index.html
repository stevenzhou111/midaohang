<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的导航</title>
  <meta name="description" content="个人导航站">
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f8fc" media="(prefers-color-scheme: light)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="我的导航">
  <meta property="og:description" content="个人导航站 · 常用站点一键直达">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23db2777'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M19 45V19h7l12 16V19h7v26h-7L26 29v16z' fill='%23ffffff'/%3E%3C/svg%3E">
  <!-- PWA：可安装到桌面 / 主屏，离线也能打开 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="导航">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* 必须在 data.js 之前注册：捕获配置文件的语法 / 运行时错误，避免白屏 */
    window.__CONFIG_ERROR__ = null;
    window.addEventListener(
      "error",
      function (e) {
        try {
          if (window.__APP_READY__ || !e || !e.message) return;
          var target = e.target || {};
          var src = target.src || e.filename || "";
          /* app.js 自己的问题由内部 try/catch 展示；这里只抓配置脚本 */
          if (!/\.js(\?|#|$)/.test(src) || /app\.js/.test(src)) return;
          window.__CONFIG_ERROR__ = {
            file: String(src).split("/").pop(),
            message: e.message || "未知错误",
            line: e.lineno || 0,
            col: e.colno || 0,
          };
        } catch (err) {}
      },
      true
    );
  </script>
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <div class="blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
    <span class="blob blob-4"></span>
    <span class="blob blob-5"></span>
  </div>

  <div class="page">
    <!-- ─────────── Hero ─────────── -->
    <header class="hero">
      <div class="hero-tools">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换深浅色主题" title="切换主题"></button>
        <button id="palette-toggle" class="icon-btn" type="button" aria-label="选择配色" title="配色主题" aria-expanded="false" aria-controls="palette-pop"></button>
        <button id="view-toggle" class="icon-btn" type="button" aria-label="切换网格 / 列表视图" title="切换视图"></button>
        <div class="palette-pop" id="palette-pop" role="group" aria-label="配色选择" hidden></div>
      </div>

      <div class="hero-inner">
        <span class="brand-mark" id="brand-mark">导</span>
        <h1 id="site-name">我的导航</h1>
        <p class="subtitle" id="site-subtitle"></p>

        <div class="search-wrap">
          <form id="search-form" class="search-box" autocomplete="off">
            <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>

            <input id="search-input" class="search-input" type="search" placeholder="搜索链接，或输入关键词搜索网页…" aria-label="搜索" role="combobox" aria-expanded="false" aria-controls="suggestions">

            <div class="engines" id="engines" role="tablist" aria-label="搜索引擎"></div>

            <kbd class="kbd" title="按 / 或 Ctrl K 聚焦搜索">/</kbd>
          </form>

          <div class="suggestions" id="suggestions" role="listbox" aria-label="搜索建议" hidden></div>
        </div>

        <p class="search-hint" id="search-hint" role="status" aria-live="polite" hidden></p>

        <div class="stats" id="hero-stats"></div>
      </div>
    </header>

    <!-- ─────────── 主体：侧边栏 + 内容 ─────────── -->
    <div class="layout">
      <aside class="sidebar">
        <nav class="side-nav" id="side-nav" aria-label="分类导航"></nav>
      </aside>

      <main class="content" id="content" tabindex="-1">
        <section class="panel panel-recent" id="panel-recent" hidden>
          <div class="panel-head panel-head-static">
            <span class="cat-emoji">⏱</span>
            <span class="panel-title">常用站点</span>
            <span class="count" id="recent-count">0</span>
            <span class="rule" aria-hidden="true"></span>
          </div>
          <div class="panel-body">
            <div class="link-grid" id="recent-grid"></div>
          </div>
        </section>

        <!-- 分类面板由 app.js 按 data.js 渲染 -->

        <p class="empty" id="empty" hidden></p>
      </main>
    </div>

    <footer class="site-footer">
      <span id="footer-text"></span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="stats"></span>
    </footer>
  </div>

  <button id="to-top" class="to-top" type="button" aria-label="回到顶部" title="回到顶部" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script src="data.js"></script>
  <script src="icons.js"></script>
  <script src="icons-img.js"></script>
  <script src="app.js"></script>
</body>
</html>
